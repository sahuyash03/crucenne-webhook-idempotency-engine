version: "3.8"

services:
  gateway-mock:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://cache:6379
      - DATABASE_URL=postgres://crucenne_admin:secure_dev_pass@postgres:5432/idempotency_store
    command: sh -c "echo 'Mock Gateway ready on port 8080' && tail -f /dev/null"
    depends_on:
      - cache
      - postgres

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crucenne_admin
      POSTGRES_PASSWORD: secure_dev_pass
      POSTGRES_DB: idempotency_store
    ports:
      - "5432:5432"